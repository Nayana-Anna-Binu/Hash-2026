    <main class="auth-wrapper">
        <div class="auth-container">
            <div class="form-panel" style="padding: 0 20px; width: 100%;">
                <h2 style="margin-bottom: 20px; color: #f8fafc;">Contact Us</h2>
                <form>
                    <label for="contactName">Your Name:</label>
                    <input type="text" id="contactName" name="contactName" required placeholder="John Doe">

                    <label for="contactEmail">Email Address:</label>
                    <input type="email" id="contactEmail" name="contactEmail" required placeholder="your@email.com">

                    <label for="contactSubject">Subject:</label>
                    <input type="text" id="contactSubject" name="contactSubject" required placeholder="How can we help?">

                    <label for="contactMessage">Message:</label>
                    <textarea id="contactMessage" name="contactMessage" rows="5" required placeholder="Type your message here..."></textarea>

                    <button type="submit" class="btn-submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>
